# Checks every environment for drift from the code. Generated by IaC Pipeline Planner.
# Plans each environment, from the branch or tag it deploys from, as its read-only plan
# identity, and opens an issue for each one that differs from the code (closed again once
# it matches).

name: IaC drift

on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  issues: write

defaults:
  run:
    shell: bash

jobs:
  drift-dev:
    name: drift (dev)
    environment: dev-plan
    runs-on: ubuntu-24.04
    env:
      ARM_ENVIRONMENT: public
      ARM_RESOURCE_PROVIDER_REGISTRATIONS: none
      TF_IN_AUTOMATION: true
      ARM_USE_OIDC: true
      ARM_CLIENT_ID: ${{ vars.AZURE_PLAN_CLIENT_ID_DEV }}
      ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID_DEV }}
      ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID_DEV }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: 'main'
      - name: Install tools
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.local/bin" && cd "$(mktemp -d)"
          curl -fsSLo terraform.zip https://releases.hashicorp.com/terraform/1.16.5/terraform_1.16.5_linux_amd64.zip
          unzip -oq terraform.zip terraform -d "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Plan
        if: env.NOTHING_DEPLOYED != '1'
        working-directory: infra
        run: |
          set -euo pipefail
          terraform init -input=false -no-color \
            -backend-config=resource_group_name=e2e-tfstate-dev-eus2-01-rg \
            -backend-config=storage_account_name=e2etfstatedeveus201st \
            -backend-config=container_name=tfstate-dev \
            -backend-config=key=dev.tfstate \
            -backend-config=use_azuread_auth=true
          terraform plan -input=false -lock=false -no-color -var-file=dev.tfvars -out=tfplan
          terraform show -no-color tfplan > plan.txt
          terraform show -json tfplan | jq '[.resource_changes[]? | select(.change.actions != ["no-op"])] | length' > changes.txt
          cat plan.txt
      - name: Report drift
        if: env.NOTHING_DEPLOYED != '1'
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- iac-drift:dev -->';
            const changes = Number(fs.readFileSync('infra/changes.txt', 'utf8').trim());
            let plan = fs.readFileSync('infra/plan.txt', 'utf8');
            if (plan.length > 60000) plan = plan.slice(0, 60000) + '\n... (cut; the job log has the full plan)';
            const run = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const { owner, repo } = context.repo;
            const issues = await github.paginate(github.rest.issues.listForRepo, { owner, repo, state: 'open' });
            const open = issues.find((i) => !i.pull_request && i.body && i.body.includes(marker));
            if (changes > 0) {
              const body = [marker, `dev differs from the code in ${changes} resource(s). Merge a fix, or apply the code to put it back.`, '', '```', plan, '```', '', `[Run](${run})`].join('\n');
              if (open) await github.rest.issues.update({ owner, repo, issue_number: open.number, body });
              else await github.rest.issues.create({ owner, repo, title: 'Drift in dev', body });
              core.warning(`dev has drifted: ${changes} change(s).`);
            } else if (open) {
              await github.rest.issues.createComment({ owner, repo, issue_number: open.number, body: `No drift any more. [Run](${run})` });
              await github.rest.issues.update({ owner, repo, issue_number: open.number, state: 'closed' });
            }

  drift-prd:
    name: drift (prd)
    environment: prd-plan
    runs-on: ubuntu-24.04
    env:
      ARM_ENVIRONMENT: public
      ARM_RESOURCE_PROVIDER_REGISTRATIONS: none
      TF_IN_AUTOMATION: true
      ARM_USE_OIDC: true
      ARM_CLIENT_ID: ${{ vars.AZURE_PLAN_CLIENT_ID_PRD }}
      ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID_PRD }}
      ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID_PRD }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: 'main'
      - name: Install tools
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.local/bin" && cd "$(mktemp -d)"
          curl -fsSLo terraform.zip https://releases.hashicorp.com/terraform/1.16.5/terraform_1.16.5_linux_amd64.zip
          unzip -oq terraform.zip terraform -d "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Plan
        if: env.NOTHING_DEPLOYED != '1'
        working-directory: infra
        run: |
          set -euo pipefail
          terraform init -input=false -no-color \
            -backend-config=resource_group_name=e2e-tfstate-prd-eus2-01-rg \
            -backend-config=storage_account_name=e2etfstateprdeus201st \
            -backend-config=container_name=tfstate-prd \
            -backend-config=key=prd.tfstate \
            -backend-config=use_azuread_auth=true
          terraform plan -input=false -lock=false -no-color -var-file=prd.tfvars -out=tfplan
          terraform show -no-color tfplan > plan.txt
          terraform show -json tfplan | jq '[.resource_changes[]? | select(.change.actions != ["no-op"])] | length' > changes.txt
          cat plan.txt
      - name: Report drift
        if: env.NOTHING_DEPLOYED != '1'
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- iac-drift:prd -->';
            const changes = Number(fs.readFileSync('infra/changes.txt', 'utf8').trim());
            let plan = fs.readFileSync('infra/plan.txt', 'utf8');
            if (plan.length > 60000) plan = plan.slice(0, 60000) + '\n... (cut; the job log has the full plan)';
            const run = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const { owner, repo } = context.repo;
            const issues = await github.paginate(github.rest.issues.listForRepo, { owner, repo, state: 'open' });
            const open = issues.find((i) => !i.pull_request && i.body && i.body.includes(marker));
            if (changes > 0) {
              const body = [marker, `prd differs from the code in ${changes} resource(s). Merge a fix, or apply the code to put it back.`, '', '```', plan, '```', '', `[Run](${run})`].join('\n');
              if (open) await github.rest.issues.update({ owner, repo, issue_number: open.number, body });
              else await github.rest.issues.create({ owner, repo, title: 'Drift in prd', body });
              core.warning(`prd has drifted: ${changes} change(s).`);
            } else if (open) {
              await github.rest.issues.createComment({ owner, repo, issue_number: open.number, body: `No drift any more. [Run](${run})` });
              await github.rest.issues.update({ owner, repo, issue_number: open.number, state: 'closed' });
            }
