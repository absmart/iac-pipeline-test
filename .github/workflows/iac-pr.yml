# Validates and plans infrastructure changes on pull requests. Generated by IaC Pipeline Planner.
# Each plan runs as the read-only plan identity of its environment. The jobs are the
# required checks, so the workflow runs on every pull request; pull requests that change nothing in
# infra skip validate and plan, which counts as passing.

name: IaC pull request

on:
  pull_request:
    branches: ['main']

permissions:
  contents: read
  id-token: write
  pull-requests: write

concurrency:
  group: iac-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  changes:
    name: changes
    runs-on: ubuntu-24.04
    outputs:
      iac: ${{ steps.diff.outputs.iac }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Check the changed files
        id: diff
        run: |
          set -euo pipefail
          changed="$(git diff --name-only "origin/$GITHUB_BASE_REF...HEAD")"
          echo "$changed"
          if grep -qE '^(infra/|\.github/workflows/iac-)' <<< "$changed"; then echo iac=true; else echo iac=false; fi >> "$GITHUB_OUTPUT"

  validate:
    name: validate
    needs: changes
    if: needs.changes.outputs.iac == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Install tools
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.local/bin" && cd "$(mktemp -d)"
          curl -fsSLo terraform.zip https://releases.hashicorp.com/terraform/1.16.5/terraform_1.16.5_linux_amd64.zip
          unzip -oq terraform.zip terraform -d "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Validate
        working-directory: infra
        run: |
          set -euo pipefail
          terraform fmt -check -recursive -diff
          terraform init -backend=false -input=false
          terraform validate -no-color
      - name: Checkov
        working-directory: infra
        run: |
          set -euo pipefail
          pipx run --spec checkov checkov --directory . --framework terraform --compact --quiet --soft-fail

  plan-dev:
    name: plan (dev)
    needs: validate
    # Pull requests from forks get no OIDC token.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    env:
      ARM_ENVIRONMENT: public
      ARM_RESOURCE_PROVIDER_REGISTRATIONS: none
      TF_IN_AUTOMATION: true
      ARM_USE_OIDC: true
      ARM_CLIENT_ID: ${{ vars.AZURE_PLAN_CLIENT_ID_DEV }}
      ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID_DEV }}
      ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID_DEV }}
    steps:
      - uses: actions/checkout@v7
      - name: Install tools
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.local/bin" && cd "$(mktemp -d)"
          curl -fsSLo terraform.zip https://releases.hashicorp.com/terraform/1.16.5/terraform_1.16.5_linux_amd64.zip
          unzip -oq terraform.zip terraform -d "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Plan
        working-directory: infra
        run: |
          set -euo pipefail
          terraform init -input=false -no-color -lock=false \
            -backend-config=resource_group_name=e2e-tfstate-dev-eus2-01-rg \
            -backend-config=storage_account_name=e2etfstatedeveus201st \
            -backend-config=container_name=tfstate-dev \
            -backend-config=key=dev.tfstate \
            -backend-config=use_azuread_auth=true
          terraform plan -input=false -lock=false -no-color -var-file=dev.tfvars -out=tfplan
          terraform show -no-color tfplan > plan.txt
      - name: Summary
        if: ${{ !cancelled() }}
        working-directory: infra
        run: |
          [ -f plan.txt ] || exit 0
          { echo "### Plan for dev"; echo; echo '```'; head -c 60000 plan.txt; echo; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: Comment on the pull request
        if: ${{ !cancelled() }}
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- iac-plan:dev -->';
            const file = 'infra/plan.txt';
            let plan = fs.existsSync(file) ? fs.readFileSync(file, 'utf8') : 'No plan: the plan step failed. See the job log.';
            if (plan.length > 60000) plan = plan.slice(0, 60000) + '\n... (cut; the job log has the full plan)';
            const run = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = [
              marker,
              `### Plan for dev`,
              '',
              `<details><summary>Show the plan for ${context.payload.pull_request.head.sha.slice(0, 7)}</summary>`,
              '',
              '```',
              plan,
              '```',
              '</details>',
              '',
              `[Run](${run})`,
            ].join('\n');
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number });
            const existing = comments.find((c) => c.body && c.body.includes(marker));
            if (existing) await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            else await github.rest.issues.createComment({ owner, repo, issue_number, body });

  plan-prd:
    name: plan (prd)
    needs: validate
    # Pull requests from forks get no OIDC token.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    env:
      ARM_ENVIRONMENT: public
      ARM_RESOURCE_PROVIDER_REGISTRATIONS: none
      TF_IN_AUTOMATION: true
      ARM_USE_OIDC: true
      ARM_CLIENT_ID: ${{ vars.AZURE_PLAN_CLIENT_ID_PRD }}
      ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID_PRD }}
      ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID_PRD }}
    steps:
      - uses: actions/checkout@v7
      - name: Install tools
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.local/bin" && cd "$(mktemp -d)"
          curl -fsSLo terraform.zip https://releases.hashicorp.com/terraform/1.16.5/terraform_1.16.5_linux_amd64.zip
          unzip -oq terraform.zip terraform -d "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Plan
        working-directory: infra
        run: |
          set -euo pipefail
          terraform init -input=false -no-color -lock=false \
            -backend-config=resource_group_name=e2e-tfstate-prd-eus2-01-rg \
            -backend-config=storage_account_name=e2etfstateprdeus201st \
            -backend-config=container_name=tfstate-prd \
            -backend-config=key=prd.tfstate \
            -backend-config=use_azuread_auth=true
          terraform plan -input=false -lock=false -no-color -var-file=prd.tfvars -out=tfplan
          terraform show -no-color tfplan > plan.txt
      - name: Summary
        if: ${{ !cancelled() }}
        working-directory: infra
        run: |
          [ -f plan.txt ] || exit 0
          { echo "### Plan for prd"; echo; echo '```'; head -c 60000 plan.txt; echo; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: Comment on the pull request
        if: ${{ !cancelled() }}
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- iac-plan:prd -->';
            const file = 'infra/plan.txt';
            let plan = fs.existsSync(file) ? fs.readFileSync(file, 'utf8') : 'No plan: the plan step failed. See the job log.';
            if (plan.length > 60000) plan = plan.slice(0, 60000) + '\n... (cut; the job log has the full plan)';
            const run = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = [
              marker,
              `### Plan for prd`,
              '',
              `<details><summary>Show the plan for ${context.payload.pull_request.head.sha.slice(0, 7)}</summary>`,
              '',
              '```',
              plan,
              '```',
              '</details>',
              '',
              `[Run](${run})`,
            ].join('\n');
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number });
            const existing = comments.find((c) => c.body && c.body.includes(marker));
            if (existing) await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            else await github.rest.issues.createComment({ owner, repo, issue_number, body });
