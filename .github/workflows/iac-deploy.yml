# Plans and deploys infrastructure changes. Generated by IaC Pipeline Planner.
# Each push deploys the environments of its branch or tag, in order:
#   main: dev → prd
# Each environment is planned as its read-only plan identity, then deployed as its deploy
# identity once the environment's reviewers approve.
# The deploy job applies the saved plan, so what was approved is what changes.

name: IaC deploy

on:
  push:
    branches: ['main']
    paths: ['infra/**', '.github/workflows/iac-deploy.yml']
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

# One deployment per branch or tag at a time, and never cancel one that has started.
concurrency:
  group: iac-deploy-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  plan-dev:
    name: plan (dev)
    if: github.ref == 'refs/heads/main'
    environment: dev-plan
    runs-on: ubuntu-24.04
    env:
      ARM_ENVIRONMENT: public
      ARM_RESOURCE_PROVIDER_REGISTRATIONS: none
      TF_IN_AUTOMATION: true
      ARM_USE_OIDC: true
      ARM_CLIENT_ID: ${{ vars.AZURE_PLAN_CLIENT_ID_DEV }}
      ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID_DEV }}
      ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID_DEV }}
    steps:
      - uses: actions/checkout@v7
      - name: Install tools
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.local/bin" && cd "$(mktemp -d)"
          curl -fsSLo terraform.zip https://releases.hashicorp.com/terraform/1.16.5/terraform_1.16.5_linux_amd64.zip
          unzip -oq terraform.zip terraform -d "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Plan
        working-directory: infra
        run: |
          set -euo pipefail
          terraform init -input=false -no-color -lock=false \
            -backend-config=resource_group_name=e2e-tfstate-dev-eus2-01-rg \
            -backend-config=storage_account_name=e2etfstatedeveus201st \
            -backend-config=container_name=tfstate-dev \
            -backend-config=key=dev.tfstate \
            -backend-config=use_azuread_auth=true
          terraform plan -input=false -lock=false -no-color -var-file=dev.tfvars -out=tfplan
          terraform show -no-color tfplan > plan.txt
          mkdir -p .tfplan && cp tfplan .terraform.lock.hcl .tfplan/
      - name: Summary
        if: ${{ !cancelled() }}
        working-directory: infra
        run: |
          [ -f plan.txt ] || exit 0
          { echo "### Plan for dev"; echo; echo '```'; head -c 60000 plan.txt; echo; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: Keep the plan
        uses: actions/upload-artifact@v7
        with:
          name: plan-dev
          path: infra/.tfplan
          include-hidden-files: true
          retention-days: 1
          if-no-files-found: error

  deploy-dev:
    name: deploy (dev)
    needs: plan-dev
    environment: dev
    runs-on: ubuntu-24.04
    env:
      ARM_ENVIRONMENT: public
      ARM_RESOURCE_PROVIDER_REGISTRATIONS: none
      TF_IN_AUTOMATION: true
      ARM_USE_OIDC: true
      ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID_DEV }}
      ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID_DEV }}
      ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID_DEV }}
    steps:
      - uses: actions/checkout@v7
      - name: Install tools
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.local/bin" && cd "$(mktemp -d)"
          curl -fsSLo terraform.zip https://releases.hashicorp.com/terraform/1.16.5/terraform_1.16.5_linux_amd64.zip
          unzip -oq terraform.zip terraform -d "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Get the plan
        uses: actions/download-artifact@v8
        with:
          name: plan-dev
          path: infra/.tfplan
      - name: Deploy
        working-directory: infra
        run: |
          set -euo pipefail
          cp .tfplan/.terraform.lock.hcl .
          terraform init -input=false -no-color \
            -backend-config=resource_group_name=e2e-tfstate-dev-eus2-01-rg \
            -backend-config=storage_account_name=e2etfstatedeveus201st \
            -backend-config=container_name=tfstate-dev \
            -backend-config=key=dev.tfstate \
            -backend-config=use_azuread_auth=true
          terraform apply -input=false -no-color .tfplan/tfplan

  plan-prd:
    name: plan (prd)
    needs: deploy-dev
    if: github.ref == 'refs/heads/main'
    environment: prd-plan
    runs-on: ubuntu-24.04
    env:
      ARM_ENVIRONMENT: public
      ARM_RESOURCE_PROVIDER_REGISTRATIONS: none
      TF_IN_AUTOMATION: true
      ARM_USE_OIDC: true
      ARM_CLIENT_ID: ${{ vars.AZURE_PLAN_CLIENT_ID_PRD }}
      ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID_PRD }}
      ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID_PRD }}
    steps:
      - uses: actions/checkout@v7
      - name: Install tools
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.local/bin" && cd "$(mktemp -d)"
          curl -fsSLo terraform.zip https://releases.hashicorp.com/terraform/1.16.5/terraform_1.16.5_linux_amd64.zip
          unzip -oq terraform.zip terraform -d "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Plan
        working-directory: infra
        run: |
          set -euo pipefail
          terraform init -input=false -no-color -lock=false \
            -backend-config=resource_group_name=e2e-tfstate-prd-eus2-01-rg \
            -backend-config=storage_account_name=e2etfstateprdeus201st \
            -backend-config=container_name=tfstate-prd \
            -backend-config=key=prd.tfstate \
            -backend-config=use_azuread_auth=true
          terraform plan -input=false -lock=false -no-color -var-file=prd.tfvars -out=tfplan
          terraform show -no-color tfplan > plan.txt
          mkdir -p .tfplan && cp tfplan .terraform.lock.hcl .tfplan/
      - name: Summary
        if: ${{ !cancelled() }}
        working-directory: infra
        run: |
          [ -f plan.txt ] || exit 0
          { echo "### Plan for prd"; echo; echo '```'; head -c 60000 plan.txt; echo; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: Keep the plan
        uses: actions/upload-artifact@v7
        with:
          name: plan-prd
          path: infra/.tfplan
          include-hidden-files: true
          retention-days: 1
          if-no-files-found: error

  deploy-prd:
    name: deploy (prd)
    needs: plan-prd
    environment: prd
    runs-on: ubuntu-24.04
    env:
      ARM_ENVIRONMENT: public
      ARM_RESOURCE_PROVIDER_REGISTRATIONS: none
      TF_IN_AUTOMATION: true
      ARM_USE_OIDC: true
      ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID_PRD }}
      ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID_PRD }}
      ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID_PRD }}
    steps:
      - uses: actions/checkout@v7
      - name: Install tools
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.local/bin" && cd "$(mktemp -d)"
          curl -fsSLo terraform.zip https://releases.hashicorp.com/terraform/1.16.5/terraform_1.16.5_linux_amd64.zip
          unzip -oq terraform.zip terraform -d "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Get the plan
        uses: actions/download-artifact@v8
        with:
          name: plan-prd
          path: infra/.tfplan
      - name: Deploy
        working-directory: infra
        run: |
          set -euo pipefail
          cp .tfplan/.terraform.lock.hcl .
          terraform init -input=false -no-color \
            -backend-config=resource_group_name=e2e-tfstate-prd-eus2-01-rg \
            -backend-config=storage_account_name=e2etfstateprdeus201st \
            -backend-config=container_name=tfstate-prd \
            -backend-config=key=prd.tfstate \
            -backend-config=use_azuread_auth=true
          terraform apply -input=false -no-color .tfplan/tfplan
